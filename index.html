<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVES V3</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050b12;
  color:#00eaff;
  font-family:Arial,sans-serif;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:95%;
  max-width:500px;
  height:90vh;
  border:1px solid #00eaff;
  border-radius:25px;
  box-shadow:0 0 30px #00eaff55;
  padding:25px;
  text-align:center;
  background:#07131d;
}

h1{
  font-size:35px;
  margin-bottom:8px;
  text-shadow:0 0 15px #00eaff;
}

.status{
  color:#8ffaff;
  margin-bottom:20px;
}

.arc{
  width:180px;
  height:180px;
  margin:20px auto;
  border:8px solid #00eaff;
  border-top-color:transparent;
  border-radius:50%;
  box-shadow:0 0 25px #00eaff;
  animation:spin 3s linear infinite;
  display:flex;
  justify-content:center;
  align-items:center;
}

.core{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#00eaff;
  box-shadow:0 0 40px #00eaff;
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

button{
  width:90%;
  padding:15px;
  margin:8px;
  border:1px solid #00eaff;
  border-radius:15px;
  background:#07131d;
  color:#00eaff;
  font-size:17px;
  cursor:pointer;
  box-shadow:0 0 10px #00eaff44;
}

button:hover{
  background:#00eaff;
  color:#001018;
}

#output{
  height:120px;
  overflow:auto;
  border:1px solid #00eaff44;
  border-radius:15px;
  padding:15px;
  margin-top:15px;
  text-align:left;
  color:#d8ffff;
}

.small{
  color:#6daeb5;
  font-size:12px;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>JARVES V3</h1>
<div class="status" id="status">System Ready</div>

<div class="arc">
  <div class="core"></div>
</div>

<button onclick="startJarves()">🎙️ Talk to Jarves</button>
<button onclick="wakeJarves()">⚡ Wake Jarves</button>

<div id="output">
Jarves: G Sir, I am ready.
</div>

<div class="small">
Urdu + English Voice Assistant
</div>

</div>

<script>

const output = document.getElementById("output");
const statusText = document.getElementById("status");

let recognition;
let listening = false;

/* =========================
   VOICE SETTINGS
========================= */

function speak(text){

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";

  speech.rate = 0.88;
  speech.pitch = 0.85;
  speech.volume = 1;

  const voices = speechSynthesis.getVoices();

  /* Prefer natural male English voice */
  let maleVoice = voices.find(v =>
    /male|David|Mark|Daniel|Google US English/i.test(v.name)
  );

  if(maleVoice){
    speech.voice = maleVoice;
  }

  speechSynthesis.speak(speech);
}

/* =========================
   OUTPUT
========================= */

function show(text){

  output.innerHTML += "<br>Jarves: " + text;
  output.scrollTop = output.scrollHeight;

}

/* =========================
   RECOGNITION
========================= */

function setupRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    show("Sorry Sir, voice recognition is not supported on this browser.");
    return null;
  }

  recognition = new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = false;

  /* Urdu + English */
  recognition.lang = "en-US";

  recognition.onstart = function(){

    listening = true;
    statusText.innerText = "Listening Sir...";

  };

  recognition.onend = function(){

    listening = false;
    statusText.innerText = "System Ready";

  };

  recognition.onerror = function(){

    listening = false;
    statusText.innerText = "Voice Error";

  };

  recognition.onresult = function(event){

    const command =
      event.results[0][0].transcript.toLowerCase();

    output.innerHTML +=
      "<br><span style='color:#00eaff'>You:</span> "
      + command;

    processCommand(command);

  };

  return recognition;
}

/* =========================
   START JARVES
========================= */

function startJarves(){

  if(!recognition){
    setupRecognition();
  }

  if(recognition){
    recognition.start();
  }

}

/* =========================
   WAKE JARVES
========================= */

function wakeJarves(){

  speak("Yes Sir. Jarves is online.");

  show("Yes Sir. Jarves is online.");

  setTimeout(()=>{
    startJarves();
  },1800);

}

/* =========================
   COMMAND SYSTEM
========================= */

function processCommand(command){

  if(
    command.includes("hello") ||
    command.includes("hi") ||
    command.includes("salam")
  ){

    respond("Hello Sir. How can I help you?");

  }

  else if(
    command.includes("how are you")
  ){

    respond("I am perfectly operational Sir.");

  }

  else if(
    command.includes("your name") ||
    command.includes("who are you")
  ){

    respond("I am Jarves, your personal AI assistant.");

  }

  else if(
    command.includes("youtube")
  ){

    respond("Opening YouTube Sir.");

    window.open(
      "https://www.youtube.com",
      "_blank"
    );

  }

  else if(
    command.includes("google")
  ){

    respond("Opening Google Sir.");

    window.open(
      "https://www.google.com",
      "_blank"
    );

  }

  else if(
    command.includes("whatsapp")
  ){

    respond("Opening WhatsApp Sir.");

    window.open(
      "https://web.whatsapp.com",
      "_blank"
    );

  }

  else if(
    command.includes("time")
  ){

    const now = new Date();

    const time =
      now.toLocaleTimeString();

    respond("Sir, the current time is " + time);

  }

  else if(
    command.includes("date")
  ){

    const now = new Date();

    const date =
      now.toLocaleDateString();

    respond("Sir, today's date is " + date);

  }

  else if(
    command.includes("jarves") ||
    command.includes("jarvis")
  ){

    respond("Yes Sir. I am listening.");

  }

  else{

    respond(
      "I heard you Sir, but I don't have that command yet."
    );

  }

}

/* =========================
   RESPONSE
========================= */

function respond(text){

  show(text);
  speak(text);

}

/* =========================
   LOAD VOICES
========================= */

speechSynthesis.onvoiceschanged = function(){

  speechSynthesis.getVoices();

};

</script>

</body>
</html>
