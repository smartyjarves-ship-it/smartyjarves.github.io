<!DOCTYPE html>
<html>
<body style="background:#050b12;color:#00eaff;text-align:center;font-family:Arial">

<h2>JARVES VOICE TEST</h2>

<button onclick="listen()" style="padding:20px;font-size:20px">
🎙️ START
</button>

<p id="status">Ready</p>
<p id="result"></p>

<script>

function listen(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        document.getElementById("status").innerText =
        "Speech Recognition NOT supported";

        return;
    }

    const r = new SpeechRecognition();

    r.lang = "en-US";
    r.continuous = false;
    r.interimResults = false;

    r.onstart = function(){

        document.getElementById("status").innerText =
        "LISTENING...";

    };

    r.onresult = function(event){

        const text =
        event.results[0][0].transcript;

        document.getElementById("result").innerText =
        "YOU SAID: " + text;

        document.getElementById("status").innerText =
        "SUCCESS";

    };

    r.onerror = function(event){

        document.getElementById("status").innerText =
        "ERROR: " + event.error;

    };

    r.onend = function(){

        console.log("Recognition ended");

    };

    r.start();
}

</script>

</body>
</html>
