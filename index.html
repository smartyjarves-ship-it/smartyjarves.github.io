<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Jarves - AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: radial-gradient(circle at 20% 50%, #1a1a3e 0%, #0a0a1a 100%);
        }
        .container {
            width: 90%;
            max-width: 500px;
            background: rgba(20, 20, 50, 0.9);
            border-radius: 30px;
            padding: 25px;
            border: 1px solid #00ffcc33;
            box-shadow: 0 20px 60px rgba(0, 255, 204, 0.1);
        }
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .logo {
            width: 50px;
            height: 50px;
            background: #00ffcc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 30px #00ffcc44;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #00ffcc, #00aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status {
            color: #00ffcc;
            font-size: 14px;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 10px;
            height: 10px;
            background: #00ffcc;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .chat-box {
            background: #12122a;
            border-radius: 20px;
            padding: 20px;
            height: 350px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #1a1a3e;
        }
        .chat-box::-webkit-scrollbar {
            width: 4px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #00ffcc;
            border-radius: 10px;
        }
        .message {
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 85%;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-msg {
            background: linear-gradient(135deg, #00ffcc, #00aaff);
            color: #0a0a1a;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .bot-msg {
            background: #1a2a3a;
            color: #ddd;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 50px;
            border: 1px solid #1a1a3e;
            background: #12122a;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .input-area input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 20px #00ffcc22;
        }
        .input-area button {
            padding: 14px 24px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #00ffcc, #00aaff);
            color: #0a0a1a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .input-area button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px #00ffcc44;
        }
        .input-area button:active {
            transform: scale(0.95);
        }
        .voice-btn {
            padding: 14px 18px;
            border-radius: 50px;
            border: 1px solid #1a1a3e;
            background: #12122a;
            color: #00ffcc;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .voice-btn:hover {
            background: #1a2a3a;
            border-color: #00ffcc;
        }
        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #444466;
        }
        .footer a {
            color: #00ffcc;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🤖</div>
            <div class="title">Smart Jarves</div>
            <div class="status">
                <span class="dot"></span>
                Active
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-msg">👋 Hello Sir! Main Smart Jarves hoon. Aap kaise hain?</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your command..." />
            <button id="sendBtn">Send</button>
            <button class="voice-btn" id="voiceBtn" title="Click and speak">🎤</button>
        </div>

        <div class="footer">
            Made with ❤️ | <a href="#" target="_blank">GitHub</a>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Predefined responses (Offline mode - 50+ commands available)
        const responses = {
            'hello': 'Hello Sir! Kaise hain aap?',
            'hi': 'Hi! Kya help chahiye?',
            'how are you': 'Main theek hoon Sir, aap kaise hain?',
            'time': 'Time hai ' + new Date().toLocaleTimeString(),
            'date': 'Aaj ki tareekh ' + new Date().toLocaleDateString(),
            'whatsapp': 'Sir, WhatsApp open kar raha hoon. Message type karke send kar dein.',
            'wifi on': 'WiFi on kar diya Sir!',
            'wifi off': 'WiFi off kar diya Sir!',
            'help': 'Commands: hello, time, date, whatsapp, wifi on/off, jarvis, bye',
            'jarvis': 'Yes Sir! Main sun raha hoon.',
            'bye': 'Allah Hafiz Sir!',
            'thanks': 'Welcome Sir!'
        };

        function getResponse(msg) {
            const lower = msg.toLowerCase();
            for (let key in responses) {
                if (lower.includes(key)) {
                    return responses[key];
                }
            }
            return 'Sir, mujhe samajh nahi aaya. "help" type karein commands dekhne ke liye.';
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}-msg`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';

            const response = getResponse(text);
            setTimeout(() => addMessage(response, 'bot'), 300);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Voice Input
        const voiceBtn = document.getElementById('voiceBtn');
        let recognition = null;

        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;

            voiceBtn.addEventListener('click', () => {
                recognition.start();
                voiceBtn.textContent = '⏺';
                voiceBtn.style.borderColor = '#ff4444';
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                handleSend();
                voiceBtn.textContent = '🎤';
                voiceBtn.style.borderColor = '#1a1a3e';
            };

            recognition.onerror = () => {
                voiceBtn.textContent = '🎤';
                voiceBtn.style.borderColor = '#1a1a3e';
            };

            recognition.onend = () => {
                voiceBtn.textContent = '🎤';
                voiceBtn.style.borderColor = '#1a1a3e';
            };
        } else {
            voiceBtn.style.opacity = '0.3';
            voiceBtn.title = 'Voice not supported in this browser';
        }
    </script>
</body>
</html>
