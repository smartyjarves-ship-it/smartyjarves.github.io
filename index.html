<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>JARVES V4</title>

<style>

body{
    margin:0;
    background:#02070d;
    color:#00eaff;
    font-family:Arial,sans-serif;
    text-align:center;
}

.container{
    width:90%;
    max-width:500px;
    margin:30px auto;
    padding:25px;
    border:1px solid #00eaff;
    border-radius:25px;
    box-shadow:0 0 30px #00eaff55;
    background:#07131c;
}

h1{
    font-size:38px;
    text-shadow:0 0 20px #00eaff;
}

#status{
    margin:15px;
    color:#8fffff;
}

.reactor{
    width:170px;
    height:170px;
    margin:25px auto;
    border:8px solid #00eaff;
    border-top-color:transparent;
    border-radius:50%;
    animation:rotate 3s linear infinite;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 25px #00eaff;
}

.core{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#00eaff;
    box-shadow:0 0 40px #00eaff;
}

@keyframes rotate{
    100%{
        transform:rotate(360deg);
    }
}

button{
    width:90%;
    padding:16px;
    margin:8px;
    border-radius:15px;
    border:1px solid #00eaff;
    background:#06121b;
    color:#00eaff;
    font-size:17px;
}

button:active{
    background:#00eaff;
    color:#001018;
}

#output{
    margin-top:20px;
    padding:15px;
    height:130px;
    overflow:auto;
    text-align:left;
    border:1px solid #00eaff44;
    border-radius:15px;
}

</style>
</head>

<body>

<div class="container">

<h1>JARVES</h1>

<div id="status">
System Ready
</div>

<div class="reactor">
    <div class="core"></div>
</div>

<button onclick="talkToJarves()">
🎙️ Talk to Jarves
</button>

<button onclick="wakeJarves()">
⚡ Wake Jarves
</button>

<div id="output">
Jarves: Yes Sir, I am ready.
</div>

</div>


<script>

let recognition = null;
let listening = false;


/* =========================
   VOICE OUTPUT
========================= */

function speak(text){

    window.speechSynthesis.cancel();

    let voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "en-US";

    voice.rate = 0.9;
    voice.pitch = 0.8;
    voice.volume = 1;

    let voices =
        window.speechSynthesis.getVoices();

    let male =
        voices.find(v =>
            /David|Mark|Daniel|George|Male/i
            .test(v.name)
        );

    if(male){
        voice.voice = male;
    }

    window.speechSynthesis.speak(voice);
}


/* =========================
   SHOW MESSAGE
========================= */

function show(message){

    let box =
        document.getElementById("output");

    box.innerHTML +=
        "<br>Jarves: " + message;

    box.scrollTop =
        box.scrollHeight;
}


/* =========================
   CREATE MICROPHONE
========================= */

function createRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        document.getElementById("status")
        .innerText =
        "Voice recognition not supported";

        speak(
            "Sorry Sir, voice recognition is not supported."
        );

        return null;
    }


    let r =
        new SpeechRecognition();


    /*
       IMPORTANT SETTINGS
    */

    r.continuous = false;

    r.interimResults = false;

    /*
       English recognition
       usually works better
       on Chrome Android
    */

    r.lang = "en-US";


    r.onstart = function(){

        listening = true;

        document.getElementById("status")
        .innerText =
        "Listening Sir...";

    };


    r.onresult = function(event){

        listening = false;

        let text =
            event.results[0][0].transcript;

        document.getElementById("status")
        .innerText =
        "Processing...";

        document.getElementById("output")
        .innerHTML +=
        "<br><span style='color:#fff'>You: "
        + text +
        "</span>";

        processCommand(text.toLowerCase());

    };


    r.onerror = function(event){

        listening = false;

        document.getElementById("status")
        .innerText =
        "Voice Error";

        console.log(
            "Voice Error:",
            event.error
        );

        /*
           Friendly error messages
        */

        if(event.error === "not-allowed"){

            speak(
                "Sir, please allow microphone permission."
            );

        }

        else if(event.error === "no-speech"){

            speak(
                "I did not hear you Sir. Please try again."
            );

        }

        else{

            speak(
                "Sorry Sir, I could not understand the voice system."
            );

        }

    };


    r.onend = function(){

        listening = false;

        document.getElementById("status")
        .innerText =
        "System Ready";

    };


    return r;
}


/* =========================
   TALK
========================= */

function talkToJarves(){

    if(listening){

        return;
    }


    /*
       Create fresh recognition
       every time
    */

    recognition =
        createRecognition();


    if(!recognition){

        return;
    }


    try{

        recognition.start();

    }

    catch(error){

        console.log(error);

    }

}


/* =========================
   WAKE
========================= */

function wakeJarves(){

    speak(
        "Yes Sir. Jarves is online."
    );

    show(
        "Yes Sir. Jarves is online."
    );

}


/* =========================
   COMMAND PROCESSOR
========================= */

function processCommand(command){


    if(
        command.includes("hello") ||
        command.includes("hi") ||
        command.includes("salam")
    ){

        respond(
            "Hello Sir. How can I help you?"
        );

    }


    else if(
        command.includes("jarvis") ||
        command.includes("jarves")
    ){

        respond(
            "Yes Sir. I am listening."
        );

    }


    else if(
        command.includes("how are you")
    ){

        respond(
            "I am fully operational Sir."
        );

    }


    else if(
        command.includes("your name") ||
        command.includes("who are you")
    ){

        respond(
            "I am Jarves, your personal AI assistant."
        );

    }


    else if(
        command.includes("time")
    ){

        let time =
            new Date().toLocaleTimeString();

        respond(
            "Sir, the current time is "
            + time
        );

    }


    else if(
        command.includes("date")
    ){

        let date =
            new Date().toLocaleDateString();

        respond(
            "Sir, today's date is "
            + date
        );

    }


    else if(
        command.includes("youtube")
    ){

        respond(
            "Opening YouTube Sir."
        );

        setTimeout(function(){

            window.open(
                "https://www.youtube.com",
                "_blank"
            );

        },1000);

    }


    else if(
        command.includes("google")
    ){

        respond(
            "Opening Google Sir."
        );

        setTimeout(function(){

            window.open(
                "https://www.google.com",
                "_blank"
            );

        },1000);

    }


    else{

        respond(
            "I heard you Sir. But I do not have that command yet."
        );

    }

}


/* =========================
   RESPONSE
========================= */

function respond(text){

    show(text);

    speak(text);

}


/* =========================
   LOAD VOICES
========================= */

window.speechSynthesis.onvoiceschanged =
function(){

    window.speechSynthesis.getVoices();

};

</script>

</body>
</html>
